<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mark Attendance — DTAI</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="roster.js"></script>
<script src="firebase-config.js"></script>
<style>
  :root {
    --ink: #1a1a1a; --ink-soft: #5a5a58; --ink-faint: #9a9a96;
    --paper: #faf9f6; --card: #ffffff; --line: #e6e4de;
    --accent: #b5541f; --accent-soft: #f4e6dc;
    --good: #2e7d32; --bad: #b03030;
  }
  [data-theme="dark"] {
    --ink: #f2f0ea; --ink-soft: #a8a49c; --ink-faint: #6e6a63;
    --paper: #0c0c0e; --card: #161618; --line: #262629;
    --accent: #ff7a45; --accent-soft: #3a2318;
    --good: #3ddc84; --bad: #ff5c5c;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--paper); margin:0; padding:0; color:var(--ink);
    overflow-x: hidden; transition: background 0.3s ease, color 0.3s ease;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 24px 20px; min-height:100vh; position: relative; }

  .brand-row { display:flex; align-items:center; gap:10px; margin-bottom:4px; }
  .node-mark { width:18px; height:18px; flex-shrink:0; }
  .node-mark circle { fill: var(--accent); }
  .node-mark .ring { fill:none; stroke:var(--accent-soft); stroke-width:1.5; }
  h1 { font-size: 20px; font-weight:700; margin:0; letter-spacing:-0.01em; }
  .sub { color:var(--ink-soft); font-size:13px; margin-bottom:22px; margin-left:28px; }

  input[type=text] {
    width:100%; padding:14px 16px; font-size:16px; border:1px solid var(--line);
    border-radius:12px; margin-bottom:12px; background:var(--card); color: var(--ink);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type=text]:focus { outline:none; border-color:var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .list { max-height: 55vh; overflow-y:auto; }
  .item {
    padding:14px 16px; background:var(--card); border:1px solid var(--line); border-radius:12px;
    margin-bottom:8px; cursor:pointer;
    transition: border-color 0.12s, transform 0.12s, background 0.12s;
    animation: itemIn 0.25s ease backwards;
  }
  .item:active { background:var(--paper); border-color:var(--accent); transform: scale(0.98); }
  .item .name { font-weight:600; font-size:15px; }
  .item .roll { color:var(--ink-faint); font-size:12px; margin-top:2px; }

  @keyframes itemIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .center { text-align:center; padding: 60px 20px; }
  .msg { font-size: 18px; font-weight:700; margin-bottom:8px; }
  .msg-sub { color:var(--ink-soft); font-size:14px; }
  .hidden { display:none; }

  .fade-panel { animation: fadeSlideIn 0.3s ease; }
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .confirmBtn {
    width:100%; padding:16px; background:var(--accent); color:white; border:none;
    border-radius:12px; font-size:16px; font-weight:700; margin-top:14px;
    transition: opacity 0.15s, transform 0.1s;
  }
  .confirmBtn:active { opacity:0.85; transform: scale(0.99); }
  .confirmBtn:disabled { opacity: 0.6; }
  .cancelBtn {
    width:100%; padding:12px; background:transparent; color:var(--ink-soft); border:1px solid var(--line);
    border-radius:12px; font-size:14px; margin-top:8px;
  }
  .selectedCard {
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px;
    text-align:center; margin-bottom:12px; animation: cardPop 0.3s cubic-bezier(0.2,0.8,0.3,1.2);
  }
  @keyframes cardPop {
    from { opacity: 0; transform: scale(0.94); }
    to { opacity: 1; transform: scale(1); }
  }

  .id-chip {
    width: 52px; height: 52px; border-radius: 50%; background: var(--accent-soft);
    display:flex; align-items:center; justify-content:center; margin: 0 auto 14px;
    font-size: 20px; font-weight: 700; color: var(--accent);
  }

  .check-wrap { width: 84px; height: 84px; margin: 0 auto 20px; }
  .check-circle {
    stroke: var(--good); stroke-width: 3; fill: none;
    stroke-dasharray: 220; stroke-dashoffset: 220;
    animation: drawCircle 0.5s ease forwards;
  }
  .check-mark {
    stroke: var(--good); stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 48; stroke-dashoffset: 48;
    animation: drawCheck 0.35s ease 0.4s forwards;
  }
  @keyframes drawCircle { to { stroke-dashoffset: 0; } }
  @keyframes drawCheck { to { stroke-dashoffset: 0; } }

  .pulse-ring {
    position: absolute; top:50%; left:50%; width:84px; height:84px;
    margin: -42px 0 0 -42px; border-radius:50%; border: 2px solid var(--good);
    opacity: 0; animation: pulseOut 0.6s ease 0.5s;
  }
  @keyframes pulseOut {
    0% { opacity: 0.5; transform: scale(0.9); }
    100% { opacity: 0; transform: scale(1.4); }
  }

  .cap-icon-wrap { width: 72px; height: 72px; margin: 0 auto 18px; position: relative; }
  .cap-icon-wrap svg { stroke: var(--bad); }

  .ledger-note {
    font-size: 11px; color:var(--ink-faint); text-align:center; margin-top: 28px;
    letter-spacing: 0.02em;
  }

  .spinner {
    width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; margin: 0 auto 16px; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">

  <div id="loadingState" class="center">
    <div class="spinner"></div>
    <div class="msg-sub">Connecting to session…</div>
  </div>

  <div id="errorState" class="center hidden fade-panel">
    <div class="cap-icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="13"/>
        <circle cx="12" cy="16.5" r="0.6" fill="#b03030"/>
      </svg>
    </div>
    <div class="msg" id="errorMsg">Session not found</div>
    <div class="msg-sub">Ask your instructor to re-display the QR code.</div>
  </div>

  <div id="searchState" class="hidden fade-panel">
    <div class="brand-row">
      <svg class="node-mark" viewBox="0 0 20 20">
        <circle class="ring" cx="4" cy="16" r="2.5"/>
        <circle class="ring" cx="16" cy="16" r="2.5"/>
        <circle cx="10" cy="4" r="3"/>
        <line x1="10" y1="4" x2="4" y2="16" stroke="#e0bd9e" stroke-width="1.2"/>
        <line x1="10" y1="4" x2="16" y2="16" stroke="#e0bd9e" stroke-width="1.2"/>
      </svg>
      <h1 id="sectionLabel">DTAI</h1>
    </div>
    <div class="sub" id="sessionDateLabel"></div>
    <input type="text" id="searchInput" placeholder="Type your name or roll no.">
    <div class="list" id="studentList"></div>
    <div class="ledger-note">Your check-in writes once to the shared session record</div>
  </div>

  <div id="confirmState" class="hidden fade-panel">
    <h1 style="margin-bottom:4px;">Confirm it's you</h1>
    <div class="sub" style="margin-left:0; margin-bottom:20px;">Double-check before submitting</div>
    <div class="selectedCard">
      <div class="id-chip" id="confirmInitial"></div>
      <div style="font-size:20px; font-weight:600;" id="confirmName"></div>
      <div style="color:#999; font-size:14px; margin-top:4px;" id="confirmRoll"></div>
    </div>
    <button class="confirmBtn" id="confirmBtn">Mark me present</button>
    <button class="cancelBtn" id="cancelBtn">Go back</button>
  </div>

  <div id="doneState" class="center hidden fade-panel">
    <div style="position:relative; display:inline-block;">
      <div class="pulse-ring"></div>
      <div class="check-wrap">
        <svg viewBox="0 0 80 80">
          <circle class="check-circle" cx="40" cy="40" r="35"/>
          <path class="check-mark" d="M24 41 L35 52 L57 28"/>
        </svg>
      </div>
    </div>
    <div class="msg">Attendance marked</div>
    <div class="msg-sub" id="doneSub"></div>
  </div>

  <div id="capState" class="center hidden fade-panel">
    <div class="cap-icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"/>
        <line x1="8" y1="8" x2="16" y2="16"/>
        <line x1="16" y1="8" x2="8" y2="16"/>
      </svg>
    </div>
    <div class="msg">Session is full</div>
    <div class="msg-sub">The expected headcount has been reached. See your instructor.</div>
  </div>

</div>

<canvas id="confettiCanvas" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:999;"></canvas>

<script>
const savedTheme = localStorage.getItem('dtai_theme') || 'light';
document.documentElement.setAttribute('data-theme', savedTheme);

const params = new URLSearchParams(location.search);
const sessionId = params.get('session');
const sectionKeys = Object.keys(SECTIONS);
const sectionKey = params.get('section') && SECTIONS[params.get('section')] ? params.get('section') : sectionKeys[0];
const ROSTER = SECTIONS[sectionKey].roster;
const db = firebase.database();
let sessionRef, sessionData, selectedStudent = null;

function show(id) {
  ['loadingState','errorState','searchState','confirmState','doneState','capState'].forEach(s => {
    document.getElementById(s).classList.toggle('hidden', s !== id);
  });
}

function initials(name) {
  const parts = name.trim().split(/\s+/);
  return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
}

async function init() {
  if (!sessionId) { show('errorState'); return; }
  sessionRef = db.ref('sessions/' + sectionKey + '/' + sessionId);
  const snap = await sessionRef.once('value');
  if (!snap.exists()) { show('errorState'); return; }
  sessionData = snap.val();
  if (sessionData.status === 'closed') {
    document.getElementById('errorMsg').textContent = 'Session closed';
    show('errorState');
    return;
  }
  document.getElementById('sectionLabel').textContent = 'DTAI ' + SECTIONS[sectionKey].label;
  document.getElementById('sessionDateLabel').textContent = sessionData.date;
  renderList('');
  show('searchState');
}

function renderList(query) {
  const q = query.trim().toLowerCase();
  const filtered = q
    ? ROSTER.filter(s => s.name.toLowerCase().includes(q) || s.roll.toLowerCase().includes(q))
    : ROSTER;
  const listEl = document.getElementById('studentList');
  listEl.innerHTML = filtered.map((s, i) => `
    <div class="item" data-roll="${s.roll}" style="animation-delay:${Math.min(i, 10) * 0.02}s">
      <div class="name">${s.name}</div>
      <div class="roll">${s.roll}</div>
    </div>
  `).join('') || '<div style="text-align:center;color:#999;padding:20px;">No match</div>';

  listEl.querySelectorAll('.item').forEach(el => {
    el.onclick = () => selectStudent(el.getAttribute('data-roll'));
  });
}

document.getElementById('searchInput').oninput = (e) => renderList(e.target.value);

function selectStudent(roll) {
  selectedStudent = ROSTER.find(s => s.roll === roll);
  document.getElementById('confirmName').textContent = selectedStudent.name;
  document.getElementById('confirmRoll').textContent = selectedStudent.roll;
  document.getElementById('confirmInitial').textContent = initials(selectedStudent.name);
  show('confirmState');
}

document.getElementById('cancelBtn').onclick = () => show('searchState');

document.getElementById('confirmBtn').onclick = async () => {
  const btn = document.getElementById('confirmBtn');
  btn.disabled = true;
  btn.textContent = 'Submitting…';

  // Re-check current state right before writing (cap + already-marked + already-closed)
  const snap = await sessionRef.once('value');
  const data = snap.val();

  if (!data || data.status === 'closed') {
    document.getElementById('errorMsg').textContent = 'Session closed';
    show('errorState');
    return;
  }

  const checkins = data.checkins || {};

  if (checkins[selectedStudent.roll]) {
    document.getElementById('doneSub').textContent = selectedStudent.name + ' was already marked present.';
    show('doneState');
    return;
  }

  if (Object.keys(checkins).length >= data.cap) {
    show('capState');
    return;
  }

  await sessionRef.child('checkins/' + selectedStudent.roll).set({
    name: selectedStudent.name,
    time: Date.now()
  });

  document.getElementById('doneSub').textContent = selectedStudent.name + ', you\'re marked present for ' + data.date + '.';
  show('doneState');
  fireConfetti();
};

function fireConfetti() {
  const canvas = document.getElementById('confettiCanvas');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  ctx.scale(dpr, dpr);

  const colors = ['#ff7a45', '#b5541f', '#3ddc84', '#f4e6dc', '#ffd166'];
  const originX = window.innerWidth / 2;
  const originY = window.innerHeight * 0.35;
  const particles = [];
  const count = 70;

  for (let i = 0; i < count; i++) {
    const angle = (Math.random() * Math.PI * 2);
    const speed = 3 + Math.random() * 6;
    particles.push({
      x: originX, y: originY,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 3,
      size: 4 + Math.random() * 5,
      color: colors[Math.floor(Math.random() * colors.length)],
      rotation: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 20,
      shape: Math.random() > 0.5 ? 'rect' : 'circle',
      life: 1
    });
  }

  let frame = 0;
  const maxFrames = 90;

  function step() {
    frame++;
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    particles.forEach(p => {
      p.vy += 0.15;
      p.x += p.vx;
      p.y += p.vy;
      p.rotation += p.rotSpeed;
      p.life = 1 - (frame / maxFrames);

      ctx.save();
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.translate(p.x, p.y);
      ctx.rotate((p.rotation * Math.PI) / 180);
      ctx.fillStyle = p.color;
      if (p.shape === 'rect') {
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    });

    if (frame < maxFrames) {
      requestAnimationFrame(step);
    } else {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    }
  }
  requestAnimationFrame(step);
}

init();
</script>
</body>
</html>
